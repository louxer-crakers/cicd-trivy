name: Container test security

on:
  push:
    branchs:
      - main

jobs:
  security-scanning:
    name: Build and scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: action/checkout@v4

      - name: Build Docker
        run: docker build -t test .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'test'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH'